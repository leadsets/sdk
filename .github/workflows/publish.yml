name: Publish

# Publishes a GitHub release to npm with the same version. Runs when release.yml starts it after a
# develop → main merge, or when a release is published by hand on GitHub.
# npm trusted publishing (OIDC): configured on npmjs.com for leadsets/sdk, workflow publish.yml.
# No NPM_TOKEN secret.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          # npm trusted publishing needs npm 11.5.1+, which ships with Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Release tag matches the package version
        id: version
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "$TAG" || { echo "Release $TAG does not match package.json $v"; exit 1; }
          if npm view "@leadsetsai/sdk@$v" version >/dev/null 2>&1; then
            echo "@leadsetsai/sdk@$v is already on npm; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published != 'true'
        run: npm ci
      - if: steps.version.outputs.published != 'true'
        run: npm run lint && npm run typecheck && npm run build && npm test
      - if: steps.version.outputs.published != 'true'
        run: npm publish --access public
